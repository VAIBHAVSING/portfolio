name: Update Contributions Cache

on:
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Step 1: Checkout the repository
      - name: Checkout
        uses: actions/checkout@v4

      # Step 2: Setup PNPM
      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # Step 3: Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # Step 4: Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Step 5: Run the TypeScript script using ts-node
      - name: Generate contributions cache
        env:
          GITHUB_TOKEN: ${{ secrets.CONTRIB_GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ secrets.CONTRIB_GITHUB_USERNAME || 'VAIBHAVSING' }}
        run: pnpm update-cache

      # Step 6: Create Pull Request if changes exist
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/update-contributions-cache
          title: "chore: update contributions cache"
          commit-message: "chore: update contributions cache"
          body: "Automated update of cached GitHub contributions JSON."
          labels: automated, contributions
          delete-branch: true
          add-paths: |
            public/data/contributions.json
