name: Update Contributions Cache

on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Step 1: Checkout the repository
      - name: Checkout
        uses: actions/checkout@v4

      # Step 2: Setup PNPM
      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # Step 3: Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      # Step 4: Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Step 5: Run the TypeScript script using ts-node
      - name: Generate contributions cache
        env:
          GITHUB_TOKEN: ${{ secrets.CONTRIB_GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ secrets.CONTRIB_GITHUB_USERNAME || 'VAIBHAVSING' }}
        run: pnpm update-cache

      # Step 6: Check if there are changes
      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code public/data/contributions.json || echo "changed=true" >> $GITHUB_OUTPUT

      # Step 7: Commit and push changes
      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Stash current changes
          git stash push -m "Temporary stash for contributions.json"

          # Check if branch exists remotely
          if git ls-remote --heads origin chore/update-contributions-cache | grep -q chore/update-contributions-cache; then
            echo "Branch exists, checking out and updating..."
            git fetch origin chore/update-contributions-cache
            git checkout chore/update-contributions-cache
            git merge --no-edit main || echo "Merge conflict or up to date"
          else
            echo "Creating new branch..."
            git checkout -b chore/update-contributions-cache
          fi

          # Apply stashed changes
          git stash pop || echo "No stash to apply"

          # Stage and commit changes
          git add public/data/contributions.json
          git commit -m "chore: update contributions cache [skip ci]"
          git push -f origin chore/update-contributions-cache

      # Step 8: Create PR if it doesn't exist (using GitHub CLI)
      - name: Create or update Pull Request
        if: steps.git-check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if OPEN PR already exists
          PR_EXISTS=$(gh pr list --state open --head chore/update-contributions-cache --json number --jq length)

          if [ "$PR_EXISTS" -eq "0" ]; then
            echo "Creating new PR..."
            gh pr create \
              --title "chore: update contributions cache" \
              --body "Automated update of cached GitHub contributions JSON." \
              --base main \
              --head chore/update-contributions-cache || echo "PR creation failed, but changes are committed"
          else
            echo "PR already exists, updated with new commit"
            gh pr view chore/update-contributions-cache --json number,title,url --jq '{number, title, url}'
          fi
