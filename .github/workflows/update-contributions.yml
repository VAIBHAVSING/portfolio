name: Update Contributions Cache

on:
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Step 1: Checkout the repository
      - name: Checkout
        uses: actions/checkout@v4

      # Step 2: Setup PNPM
      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # Step 3: Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # Step 4: Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Step 5: Run the TypeScript script using ts-node
      - name: Generate contributions cache
        env:
          GITHUB_TOKEN: ${{ secrets.CONTRIB_GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ secrets.CONTRIB_GITHUB_USERNAME || 'VAIBHAVSING' }}
        run: node --loader ts-node/esm scripts/update-contributions-cache.ts

      # Step 6: Commit any changes
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain public/data/contributions.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -B chore/update-contributions-cache
            git add public/data/contributions.json
            git commit -m "chore: update contributions cache"
          else
            echo "No changes to commit"

      # Step 7: Create Pull Request if changes exist
      - name: Create Pull Request
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/update-contributions-cache
          title: "chore: update contributions cache"
          commit-message: "chore: update contributions cache"
          body: "Automated update of cached GitHub contributions JSON."
          labels: automated, contributions
          delete-branch: true
